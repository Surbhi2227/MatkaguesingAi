<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Satta Matka | Matka Guessing | Kalyan Matka</title>
<style>
body{margin:0;font-family:Arial;background:#fef3c7}
.header{background:#7c1d4d;color:#fff;display:flex;gap:6px;padding:8px}
.header a{color:#fff;text-decoration:none;padding:6px 10px;border-radius:4px}
.header a.active{background:#ffeb3b;color:#000}
.card{background:#fffbe6;border:2px solid #b45309;margin:10px;border-radius:10px;padding:10px;text-align:center;position:relative}
.name{font-weight:bold;font-size:18px;color:#7c1d4d}
.result{font-size:22px;font-weight:bold;margin:6px 0}
.time{font-size:12px;color:#555}
.badge{position:absolute;top:5px;right:5px;background:green;color:#fff;font-size:10px;padding:2px 6px;border-radius:10px}
.btn{padding:6px 14px;border-radius:6px;text-decoration:none;color:#fff;font-weight:bold;margin:4px;display:inline-block}
.btn-jodi{background:#e91e63}
.btn-panel{background:#e91e63}
.row{display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="header">
<a class="active">Result</a><a>Charts</a><a>Guessing</a><a>Forum</a><a>VIP</a>
</div>
<div id="markets"></div>
<script>
const markets=[
{name:"PRABHAT",result:"457-62-237",time:"1:25 PM 3:05 PM"},
{name:"MADHUR DAY",result:"168-56-339",time:"1:30 PM 2:30 PM"},
{name:"TARA MUMBAI DAY",result:"189-85-129",time:"1:35 PM 2:35 PM"},
{name:"MILAN DAY",result:"128-19-469",time:"3:05 PM 5:05 PM"},
{name:"RAJDHANI DAY",result:"345-25-300",time:"3:10 PM 5:10 PM"},
{name:"KALYAN",result:"289-91-146",time:"4:15 PM 6:15 PM"},
{name:"TIME BAZAR DAY",result:"489-17-240",time:"4:00 PM 6:00 PM"},
{name:"MAIN MUMBAI",result:"***-**-***",time:"8:30 PM 10:30 PM"},
];
const div=document.getElementById('markets');
markets.forEach(m=>{
 const slug=m.name.toLowerCase().replace(/ /g,'-');
 div.innerHTML+=`<div class="card"><span class="badge">Declared</span><div class="name">${m.name}</div><div class="result">${m.result}</div><div class="time">${m.time}</div><div class="row"><a class="btn btn-jodi" href="panel.html?market=${slug}">Jodi</a><span style="flex:1"></span><a class="btn btn-panel" href="panel.html?market=${slug}">Panel</a></div></div>`;
});
</script>
</body>
</html>
