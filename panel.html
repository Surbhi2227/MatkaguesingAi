<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<title>KALYAN PANEL - ORIGINAL STYLE</title>
<style>
body{margin:0;font-family:Arial;background:#f5e6c8}
.top{background:#b91c4c;color:#fff;display:flex;gap:18px;padding:10px;font-weight:bold}
h2{background:#b91c4c;color:#fff;text-align:center;margin:0;padding:12px;font-size:22px}
.filter{background:#fff8dc;padding:12px;margin:10px;border:2px solid #b91c4c;border-radius:10px}
.filter input,.filter select{width:100%;padding:10px;border-radius:6px;border:1px solid #999;margin:5px 0}
table{width:100%;border-collapse:collapse;background:#fff}
th{background:#b91c4c;color:#fff;padding:8px 2px;font-size:12px}
td{border:1px solid #999;padding:2px 0;text-align:center;vertical-align:middle;min-width:60px}
td.week{background:#e9d5ff;font-weight:bold;font-size:10px;min-width:48px}
.cell{display:flex;justify-content:center;align-items:center;gap:3px}
.pana-v{display:flex;flex-direction:column;font-size:12px;line-height:1.1}
.jodi{font-weight:bold;font-size:16px;padding:0 2px;color:#000}
.jodi.red,.pana-v.red{color:#fff;background:#ff0000;border-radius:3px}
.note{font-size:11px;background:#fef3c7;padding:8px;border-radius:6px;margin-top:8px}
</style></head><body>
<div class="top"><span>Result</span><span style="border-bottom:3px solid yellow">Charts</span><span>Guessing</span><span>Forum</span><span>VIP</span></div>
<h2>KALYAN PANEL CHART</h2>
<div class="filter">
<b>YOUR INVENTION SEARCH</b>
<input id="q" value="12" placeholder="Find: 12 (CP), 123 (pana), 51 (jodi)" oninput="render()">
<select id="hl" onchange="render()">
<option value="none">Nothing</option>
<option value="cp" selected>CP Pana List (10 per CP) - RED</option>
<option value="panafamily">Family of Pana (FM-35)</option>
<option value="start">Start Digit</option>
<option value="mid">Middle Digit</option>
<option value="end">End Digit</option>
</select>
<label><input type="checkbox" id="only" onchange="render()"> Only weeks with a match</label>
<div class="note"><b>V6 CANONICAL:</b> 487->478, 738->378. Vertical layout like screenshot: Left 3 digits (open) + Middle Jodi + Right 3 digits (close). Try 12 = 112,122 etc RED</div>
</div>
<div style="overflow:auto"><table><thead><tr><th>2012</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th></tr></thead><tbody id="body"></tbody></table></div>
<script>
function canonical(p){return p.split('').sort().join('');}
function ank(p){return (parseInt(p[0])+parseInt(p[1])+parseInt(p[2]))%10;}
function randPana(){let a=Math.floor(Math.random()*10),b=Math.floor(Math.random()*10),c=Math.floor(Math.random()*10);if(a===b&&b===c)return randPana();return canonical(''+a+b+c);}

const CP_MAP={'11':['112','118','119','110','101','011'].map(canonical),'12':['112','122','123','124','125','126','127','128','129','120'].map(canonical),'13':['113','133','134','135','136','137','138','139','130','103'].map(canonical)};
const FM={'123':['123','128','137','178','236','268','367','678'].map(canonical)};

const weeks=[];let sd=new Date('2012-12-31');
for(let w=0;w<20;w++){let d=new Date(sd);d.setDate(d.getDate()+w*7);let row={week:d.toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit'}),days:[]};for(let i=0;i<6;i++){
let open=(w==1&&i==2)?canonical('123'):randPana();
let close=randPana();
let jodi=''+ank(open)+ank(close);
row.days.push({open:canonical(open),close:canonical(close),jodi});}weeks.push(row);}

function render(){
 const q=document.getElementById('q').value.trim();const hl=document.getElementById('hl').value;const only=document.getElementById('only').checked;
 let html='';weeks.forEach((w,wi)=>{
  let tds=w.days.map(c=>{
   let match=!q||c.open.includes(q)||c.close.includes(q)||c.jodi===q||(CP_MAP[q]&&CP_MAP[q].includes(c.open))||(CP_MAP[q]&&CP_MAP[q].includes(c.close));
   if(only&&q&&!match) return null;
   let redOpen=false,redClose=false,redJodi=false;
   if(hl==='cp'&&q&&CP_MAP[q]){redOpen=CP_MAP[q].includes(c.open);redClose=CP_MAP[q].includes(c.close);}
   if(hl==='panafamily'&&q){let cq=canonical(q);let fam=FM[cq]||[];redOpen=fam.includes(c.open);redClose=fam.includes(c.close);}
   if(hl==='start'){redOpen=c.open[0]===q[0];redClose=c.close[0]===q[0];}
   if(hl==='mid'){redOpen=c.open[1]===q[0];redClose=c.close[1]===q[0];}
   if(hl==='end'){redOpen=c.open[2]===q[0];redClose=c.close[2]===q[0];}
   if(q&&c.jodi===q) redJodi=true;
   return `<td><div class="cell">
   <div class="pana-v ${redOpen?'red':''}"><span>${c.open[0]}</span><span>${c.open[1]}</span><span>${c.open[2]}</span></div>
   <div class="jodi ${redJodi||redOpen||redClose?'red':''}">${c.jodi}</div>
   <div class="pana-v ${redClose?'red':''}"><span>${c.close[0]}</span><span>${c.close[1]}</span><span>${c.close[2]}</span></div>
   </div></td>`;
  }).filter(x=>x!==null);
  if(only&&tds.length===0) return;
  html+=`<tr><td class="week">${w.week}</td>${tds.join('')}</tr>`;
 });
 document.getElementById('body').innerHTML=html;
}
render();
</script></body></html>
