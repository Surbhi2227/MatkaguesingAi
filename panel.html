<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KALYAN PANEL CHART - YOUR INVENTION</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#fff}
.top{background:#7c1450;color:#fff;display:flex;gap:12px;padding:8px 10px;font-size:14px}
.top a{color:#fff;text-decoration:none}
h1{color:#7c1450;text-align:center;margin:12px 5px 2px;font-size:22px}
.sub{text-align:center;font-weight:bold;font-size:18px}
.btn{display:block;margin:8px auto;background:#7c1450;color:#fff;border:none;padding:8px 18px;border-radius:6px}
.filter{background:#111;color:#fff;padding:15px;margin:12px;border-radius:12px}
.filter b{font-size:18px;display:block;margin-bottom:6px}
.filter input,.filter select{width:100%;padding:10px;border-radius:6px;border:none;margin:6px 0 10px;font-size:15px;box-sizing:border-box}
.note{background:#fef3c7;color:#000;padding:10px;border-radius:8px;font-size:13px;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#7c1450;color:#fff;padding:6px 2px;position:sticky;top:0}
td{border:1px solid #ddd;padding:4px 2px;text-align:center;min-width:48px}
td.week{background:#f3e8ff;font-weight:bold;min-width:70px}
.pana{display:block}
.jodi{color:#7c1450;font-weight:bold}
.red{background:#ff0000!important;color:#fff!important;border-radius:4px;padding:1px 2px}
</style>
</head>
<body>
<div class="top"><a>Result</a><a>Charts</a><a>Guessing</a><a>Forum</a><a>VIP</a></div>
<h1>KALYAN PANEL CHART - YOUR INVENTION</h1>
<div class="sub" id="latest">289-91-146 Declared</div>
<button class="btn" onclick="window.scrollTo(0,document.body.scrollHeight)">Go to latest</button>
<div class="filter">
<b>SEARCH & FILTER - CP + PANA FAMILY + DIGIT POSITION</b>
<label>Find: ank, jodi, CP (55), panna, pana digit</label>
<input id="q" value="12" placeholder="e.g. 12 , 123 , 1 , 289" oninput="render()">
<label>Highlight:</label>
<select id="hl" onchange="render()">
<option value="none">Nothing</option>
<option value="cp" selected>CP Pana List (10 per CP)</option>
<option value="cpfamily">Family of CP</option>
<option value="panafamily">Family of Pana (FM-35)</option>
<option value="start">Pana Start Digit</option>
<option value="mid">Pana Middle Digit</option>
<option value="end">Pana End Digit</option>
</select>
<label>Show:</label>
<select id="show" onchange="render()"><option>All weeks</option><option>Last 4 weeks</option><option>Last 10 weeks</option></select>
<div style="margin-top:8px"><input type="checkbox" id="only" onchange="render()" style="width:auto"> Only weeks with a match</div>
<div class="note">V2 Fixed: Blank screen bug fixed. Try 12 + CP Pana List = RED. Type 1 + Start Digit = all 1xx RED.</div>
</div>
<div style="overflow:auto">
<table><thead><tr><th>Week</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th></tr></thead><tbody id="body"></tbody></table>
</div>
<div id="msg" style="text-align:center;padding:20px;color:#777"></div>
<script>
const CP_MAP={'11':['112','121','211','110','101','011','119','191','911','118'],'12':['112','122','123','124','125','126','127','128','129','120'],'13':['113','133','134','135','136','137','138','139','130','103'],'23':['123','232','233','234','235','236','237','238','239','230'],'44':['144','244','344','440','404','044','448','484','844','445'],'89':['189','289','389','489','589','689','789','890','809','089']};
const FM={'123':['123','128','137','178','236','268','367','678'],'146':['146','149','160','169','179','247','269','349','479','368','467','569'],'289':['289','280','235','359','369','479','489','589','579','578'],'157':['157','159','150','168','178','269','367','458','467','568']};
function randPana(){let n=Math.floor(100+Math.random()*899);let s=n.toString();if(s[0]==s[1]||s[1]==s[2]||s[0]==s[2])return randPana();return s;}
function jodiFrom(p){return ((parseInt(p[0])+parseInt(p[1])+parseInt(p[2]))%10).toString();}
const weeks=[];const startDate=new Date('2024-11-01');
for(let w=0;w<32;w++){let d=new Date(startDate);d.setDate(d.getDate()+w*7);let weekStr=d.toISOString().slice(0,10);let row={week:weekStr,days:[]};for(let i=0;i<6;i++){let pana=(w==2&&i==1)?'123':(w==3&&i==2)?'128':(w==5&&i==0)?'112':(w==1&&i==3)?'120':randPana();let j=jodiFrom(pana);row.days.push({pana,jodi:j,open:randPana(),openJ:jodiFrom(randPana())});}weeks.push(row);}
function getCPFamily(cp){if(!cp)return[];let base=parseInt(cp)%100;let f=[];for(let k=-5;k<=5;k++){let v=(base+k+100)%100;if(v<10)f.push('0'+v);else f.push(''+v);}return [...new Set(f)];}
function isMatch(cell,q){if(!q)return true;q=q.trim();if(!q)return true;if(cell.pana.includes(q))return true;if(cell.jodi===q)return true;if(cell.open.includes(q))return true;if(CP_MAP[q]&&CP_MAP[q].includes(cell.pana))return true;if(CP_MAP[q]&&CP_MAP[q].includes(cell.open))return true;return false;}
function shouldRed(cell,q,mode){if(!q)return false;q=q.trim();if(mode==='none')return false;if(mode==='cp'){return (CP_MAP[q]&&(CP_MAP[q].includes(cell.pana)||CP_MAP[q].includes(cell.open)));}if(mode==='cpfamily'){let fam=getCPFamily(q);return fam.includes(cell.jodi)||fam.includes(q);}if(mode==='panafamily'){let fam=FM[q]||[];for(let k in FM){if(FM[k].includes(q))fam=FM[k];}return fam.includes(cell.pana)||fam.includes(cell.open);}if(mode==='start'){return cell.pana[0]===q[0]||cell.open[0]===q[0];}if(mode==='mid'){return cell.pana[1]===q[0]||cell.open[1]===q[0];}if(mode==='end'){return cell.pana[2]===q[0]||cell.open[2]===q[0];}return false;}
function render(){const q=document.getElementById('q').value;const hl=document.getElementById('hl').value;const only=document.getElementById('only').checked;const show=document.getElementById('show').value;let filtered=weeks;if(show==='Last 4 weeks')filtered=weeks.slice(-4);if(show==='Last 10 weeks')filtered=weeks.slice(-10);let html='';let totalMatch=0;filtered.forEach(w=>{let rowMatch=false;let tds=w.days.map(d=>{let match=isMatch(d,q);if(match)rowMatch=true;let redP=shouldRed(d,q,hl);let redO=shouldRed({pana:d.open,open:d.pana},q,hl);let clsP=redP?'red':'';let clsO=redO?'red':'';return `<td><span class="pana ${clsO}">${d.open}</span><span class="jodi">${d.openJ}</span><span class="pana ${clsP}">${d.pana}</span><span class="jodi">${d.jodi}</span></td>`;}).join('');if(only&&q&&!rowMatch)return;if(rowMatch)totalMatch++;html+=`<tr><td class="week">${w.week}</td>${tds}</tr>`;});document.getElementById('body').innerHTML=html;const msg=document.getElementById('msg');if(html===''){msg.innerHTML=`No match for "<b>${q}</b>" with filter. <br>Uncheck "Only weeks with a match" to see all weeks.`;}else{if(q&&only)msg.innerHTML=`Found ${totalMatch} weeks with match for <b>${q}</b>`;else msg.innerHTML=`Showing ${filtered.length} weeks. Try 12 + CP Pana List = RED highlights`;}}
render();
</script>
</body>
  </html>
