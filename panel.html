<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<title>V10 EXCEL</title>
<style>
body{margin:0;font-family:Arial;background:#fff3d6}
.top{background:#c2185b;color:#fff;display:flex;gap:16px;padding:10px;font-weight:bold;font-size:13px}
h2{background:#c2185b;color:#fff;text-align:center;margin:0;padding:14px;font-size:20px}
.filter{background:#fff;padding:12px;margin:10px;border:2px solid #c2185b;border-radius:12px}
.filter input,.filter select{width:100%;padding:11px;border-radius:8px;border:1px solid #999;margin:6px 0;font-size:14px;box-sizing:border-box}
.note{background:#fff3cd;padding:10px;border-radius:8px;font-size:11px;margin-top:8px;border:1px solid #ffc107;line-height:1.4}
table{width:100%;border-collapse:collapse;background:#fff}
th{background:#c2185b;color:#fff;padding:8px 2px;font-size:11px;position:sticky;top:0;z-index:2}
td{border:1px solid #bbb;padding:2px 0;text-align:center;min-width:62px;vertical-align:middle}
td.week{background:#f3e5f5;font-weight:bold;font-size:10px;min-width:68px}
.cell3{display:flex;justify-content:center;align-items:center;gap:3px;min-height:54px}
.col{display:flex;flex-direction:column;line-height:1.15;font-size:13px;font-weight:500}
.jodi-col{font-weight:900;font-size:16px;min-width:30px;text-align:center}
.red{background:#ff0000!important;color:#fff!important;border-radius:4px;padding:1px 3px}
.small{font-size:10px;color:#666;text-align:center;padding:4px}
</style></head><body>
<div class="top"><span>Result</span><span style="border-bottom:3px solid #ffeb3b">Charts</span><span>Guessing</span></div>
<h2>KALYAN PANEL CHART - YOUR EXCEL DATA</h2>
<div class="filter">
<b>V10 (EXCEL) - 55 CP + 35 FAMILY</b>
<input id="q" value="235" placeholder="Find: 235, 12, 123, 59" oninput="render()">
<select id="hl" onchange="render()">
<option value="none">Nothing</option>
<option value="cp" selected>CP Pana List (55 CP x 10 pana)</option>
<option value="panafamily">Family of Pana - 35 Families (8 pana each)</option>
<option value="ank">Ank Family (22 pana)</option>
<option value="start">Start Digit</option>
<option value="mid">Middle Digit</option>
<option value="end">End Digit</option>
</select>
<div style="display:flex;gap:6px"><select id="show" onchange="render()" style="flex:1"><option>All weeks</option><option>Last 4 weeks</option><option>Last 10 weeks</option></select><label style="display:flex;align-items:center;gap:4px;font-size:11px"><input type="checkbox" id="only" onchange="render()" style="width:auto;margin:0"> Only match</label></div>
<div class="note"><b>V10:</b> CP12=112,122,123,124,125,126,127,128,129,120 | 235 Family=230,235,280,258,357,370,578,780 (8) from Excel | Canonical 0-last: 012→120, 069→690 | Vertical: 7/9/9 | 51 | 1/5/5</div>
</div>
<div style="overflow:auto"><table><thead><tr><th>Date</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="small" id="msg"></div>
<script>
function canonical(p){p=p.toString();if(p.length===1) p=p.padStart(3,'0');if(p.length===2) p=p.padStart(3,'0');if(p.length!==3) return p;let d=p.split('').map(x=>parseInt(x));d.sort((a,b)=>{let va=a===0?10:a;let vb=b===0?10:b;return va-vb;});return d.join('');}
function ank(p){p=canonical(p);return (parseInt(p[0])+parseInt(p[1])+parseInt(p[2]))%10;}
function randCan(){let a=Math.floor(Math.random()*10),b=Math.floor(Math.random()*10),c=Math.floor(Math.random()*10);if(a===b&&b===c&&Math.random()<0.92) return randCan();return canonical(''+a+b+c);}
function toCan(arr){let seen=new Set();let out=[];arr.forEach(x=>{let c=canonical(x);if(!seen.has(c)){seen.add(c);out.push(c);}});return out;}
const CP_MAP={'10':['100','110','120','130','140','150','160','170','180','190'],'11':['111','110','112','113','114','115','116','117','118','119'],'12':['112','122','123','124','125','126','127','128','129','120'],'13':['113','133','123','134','135','136','137','138','139','130'],'14':['114','144','124','134','145','146','147','148','149','140'],'15':['115','155','125','135','145','156','157','158','159','150'],'16':['116','166','126','136','146','156','167','168','169','160'],'17':['117','177','127','137','147','157','167','178','179','170'],'18':['118','188','128','138','148','158','168','178','189','180'],'19':['119','199','129','139','149','159','169','179','189','190'],'20':['200','220','120','230','240','250','260','270','280','290'],'23':['223','233','123','234','235','236','237','238','239','230'],'24':['224','244','124','234','245','246','247','248','249','240'],'25':['225','255','125','235','245','256','257','258','259','250'],'26':['226','266','126','236','246','256','267','268','269','260'],'27':['227','277','127','237','247','257','267','278','279','270'],'28':['228','288','128','238','248','258','268','278','289','280'],'29':['229','299','129','239','249','259','269','279','289','290'],'30':['300','330','130','230','340','350','360','370','380','390'],'34':['334','344','134','234','345','346','347','348','349','340'],'35':['335','355','135','235','345','356','357','358','359','350'],'36':['336','366','136','236','346','356','367','368','369','360'],'37':['337','377','137','237','347','357','367','378','379','370'],'38':['338','388','138','238','348','358','368','378','389','380'],'39':['339','399','139','239','349','359','369','379','389','390']};
const FM_35={'123':['123','128','137','178','236','268','367','678'],'245':['245','290','470','579','240','259','457','790'],'146':['119','146','669','114','169','466'],'227':['227','777','277','222'],'380':['335','380','588','330','358','880'],'349':['344','399','489','349','448','899'],'560':['100','155','560','150','556','600'],'129':['129','147','246','679','124','179','269','467'],'345':['345','390','480','589','890','340','359','458'],'160':['115','160','566','110','156','660'],'237':['228','237','778','223','278','377'],'138':['138','336','688','133','368','188'],'499':['444','499','449','999'],'570':['570','200','255','700','250','557'],'139':['139','148','346','689','134','189','369','468'],'120':['120','157','256','670','125','170','260','567'],'166':['111','166','116','666'],'247':['229','247','779','224','279','477'],'238':['238','337','788','233','378','288'],'490':['445','490','599','440','459','990'],'580':['300','580','355','800','350','558'],'130':['130','135','158','180','360','356','568','680'],'234':['234','239','289','248','347','379','478','789'],'126':['126','167','112','117','266','667'],'270':['270','257','220','225','577','770'],'338':['338','388','333','888'],'469':['469','149','144','199','446','699'],'450':['450','590','400','900','455','559'],'145':['145','140','190','159','456','460','569','690'],'230':['230','235','280','258','357','370','578','780'],'136':['136','168','113','118','366','668'],'127':['127','267','122','226','177','677'],'389':['389','348','334','488','339','889'],'249':['249','479','244','299','447','799'],'550':['550','500','555','000']};
for(let k in CP_MAP){CP_MAP[k]=toCan(CP_MAP[k]);}for(let k in FM_35){FM_35[k]=toCan(FM_35[k]);}
const PANA_TO_FAMILY={};for(let root in FM_35){FM_35[root].forEach(p=>{let cp=canonical(p);PANA_TO_FAMILY[cp]=FM_35[root];});}
const ANK_FAMILY={0:['000','118','127','136','145','190','226','235','244','280','299','334','370','389','460','479','488','550','569','578','668','677'],1:['100','119','128','137','146','155','227','236','245','290','335','344','380','399','470','489','560','579','588','669','678','777'],2:['110','129','138','147','156','200','228','237','246','255','336','345','390','444','480','499','570','589','660','679','688','778']};
for(let k in ANK_FAMILY){ANK_FAMILY[k]=toCan(ANK_FAMILY[k]);}
const weeks=[];let sd=new Date('2024-11-08');for(let w=0;w<26;w++){let d=new Date(sd);d.setDate(d.getDate()+w*7);let row={week:d.toISOString().slice(0,10),days:[]};for(let i=0;i<6;i++){let open,close;if(w===0&&i===0){open=canonical('235');close=canonical('123');}else if(w===0&&i===1){open=canonical('280');close=canonical('128');}else if(w===0&&i===2){open=canonical('370');close=canonical('137');}else if(w===1&&i===0){open=canonical('230');close=canonical('578');}else {open=randCan();close=randCan();}let jodi=''+ank(open)+ank(close);row.days.push({open,close,jodi});}weeks.push(row);}
function shouldRed(cell,q,mode){if(!q) return false;q=q.trim();let cq=q.length===3?canonical(q):q;if(mode==='none') return false;if(mode==='cp'){let list=CP_MAP[q]||[];return list.includes(cell.open)||list.includes(cell.close);}if(mode==='panafamily'){let fam=PANA_TO_FAMILY[cq]||FM_35[cq]||[];if(fam.length===0){for(let k in FM_35){if(FM_35[k].includes(cq)) fam=FM_35[k];}}return fam.includes(cell.open)||fam.includes(cell.close);}if(mode==='ank'){let a=parseInt(q);if(isNaN(a)) a=ank(cq);let fam=ANK_FAMILY[a]||[];return fam.includes(cell.open)||fam.includes(cell.close);}if(mode==='start') return cell.open[0]===q[0]||cell.close[0]===q[0];if(mode==='mid') return cell.open[1]===q[0]||cell.close[1]===q[0];if(mode==='end') return cell.open[2]===q[0]||cell.close[2]===q[0];return false;}
function render(){const q=document.getElementById('q').value.trim();const hl=document.getElementById('hl').value;const only=document.getElementById('only').checked;const show=document.getElementById('show').value;let filtered=weeks;if(show==='Last 4 weeks') filtered=weeks.slice(-4);if(show==='Last 10 weeks') filtered=weeks.slice(-10);let html='';filtered.forEach(w=>{let tds=[];w.days.forEach(c=>{let cq=q.length===3?canonical(q):q;let fam=PANA_TO_FAMILY[cq]||FM_35[cq]||[];if(fam.length===0){for(let k in FM_35){if(FM_35[k].includes(cq)) fam=FM_35[k];}}let cpList=CP_MAP[q]||[];let ankList=[];if(hl==='ank'){let a=parseInt(q);if(isNaN(a)) a=ank(cq);ankList=ANK_FAMILY[a]||[];}let isMatch=!q || c.open===cq || c.close===cq || c.jodi===q || cpList.includes(c.open)||cpList.includes(c.close)||fam.includes(c.open)||fam.includes(c.close)||ankList.includes(c.open)||ankList.includes(c.close);if(only&&q&&!isMatch) return;let rOpen=shouldRed(c,q,hl);let rClose=shouldRed({open:c.close,close:c.open},q,hl);let rJodi=(q&&c.jodi===q);tds.push(`<td><div class="cell3"><div class="col ${rOpen?'red':''}"><span>${c.open[0]}</span><span>${c.open[1]}</span><span>${c.open[2]}</span></div><div class="jodi-col ${rJodi||rOpen||rClose?'red':''}">${c.jodi}</div><div class="col ${rClose?'red':''}"><span>${c.close[0]}</span><span>${c.close[1]}</span><span>${c.close[2]}</span></div></div></td>`);});if(only&&tds.length===0) return;if(tds.length>0) html+=`<tr><td class="week">${w.week}</td>${tds.join('')}</tr>`;});document.getElementById('body').innerHTML=html||'<tr><td colspan=7>No match</td></tr>';let famShow='';if(q.length===3){let cq=canonical(q);let fam=PANA_TO_FAMILY[cq]||FM_35[cq]||[];if(fam.length===0){for(let k in FM_35){if(FM_35[k].includes(cq)) fam=FM_35[k];}}if(fam.length>0) famShow=`Family of ${q} (${cq}): ${fam.join(', ')} | `;let cp=CP_MAP[q];if(cp) famShow+=`CP ${q}: ${cp.join(', ')}`;}document.getElementById('msg').textContent=famShow;}render();
</script></body></html>
